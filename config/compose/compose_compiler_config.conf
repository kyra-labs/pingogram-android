// Compose compiler stability configuration (docs/PERFORMANCE.md §4), applied to every module with Compose by the
// pingogram.android.compose convention plugin. The classes matched here count as stable, so UI state may hold them
// directly instead of copying them into UI models, and composables taking them skip when they are equal.
//
// The domain models of core:domain are immutable snapshots (docs/ARCHITECTURE.md, Repositories): data classes,
// objects and enums whose properties are vals of primitives, String, kotlinx immutable collections, other models,
// DomainError (a sealed set of data classes and objects), kotlin.time's Duration and ComparableTimeMark (value
// types). Exceptions, all safe in practice:
// - Minithumbnail, Waveform, ReportOptionId and CallbackData hold a ByteArray. core:data creates it while mapping and
//   nothing writes to it later; all four compare by content, so equal snapshots stay equal.
// - Country.callingCodes is a read-only List, created by core:data's mapper and never cast back to a mutable one.
// `**` also matches nested classes such as MessageContent.Photo.
dev.kyralabs.pingogram.core.domain.model.**
