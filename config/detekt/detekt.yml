# detekt config for every module (convention plugin `pingogram.detekt`). It is applied on top of
# detekt's default config (`--build-upon-default-config`), so list only deviations, each with a reason.

naming:
  FunctionNaming:
    # Composables are PascalCase, matching the ktlint exception in .editorconfig.
    ignoreAnnotated: ['Composable']
    # detekt's default test excludes (test names are sentences in backticks), plus :app's flavor test sources
    # (testFoss, testGms), which its defaults do not know.
    excludes:
      - '**/test/**'
      - '**/androidTest/**'
      - '**/commonTest/**'
      - '**/jvmTest/**'
      - '**/androidUnitTest/**'
      - '**/androidInstrumentedTest/**'
      - '**/jsTest/**'
      - '**/iosTest/**'
      - '**/testFoss/**'
      - '**/testGms/**'

complexity:
  CyclomaticComplexMethod:
    # A function that is one exhaustive `when` over a TDLib sum type (e.g. AuthorizationState → AuthState) is
    # a flat lookup table, not complex control flow.
    ignoreSingleWhenExpression: true
  LongParameterList:
    # Composables take state, callbacks and an optional `modifier`; parameters with defaults are optional.
    ignoreDefaultParameters: true
  TooManyFunctions:
    # detekt's default test excludes and :app's flavor test sources, plus core:testing, which is test code too: fixture objects such as
    # TdApiFixtures hold one builder per TDLib type.
    excludes:
      - '**/test/**'
      - '**/androidTest/**'
      - '**/commonTest/**'
      - '**/jvmTest/**'
      - '**/androidUnitTest/**'
      - '**/androidInstrumentedTest/**'
      - '**/jsTest/**'
      - '**/iosTest/**'
      - '**/testFoss/**'
      - '**/testGms/**'
      - '**/core/testing/src/main/**'

style:
  MagicNumber:
    # A named property is not a magic number. Literal design values in feature code are caught by
    # PingogramHardcodedToken instead.
    ignorePropertyDeclaration: true
    # detekt's default test excludes and :app's flavor test sources, plus core:ui's theme package: it is where the design tokens
    # (and the color science behind harmonization) are written down as literals; and core:testing, which is
    # test code (fixture values).
    excludes:
      - '**/test/**'
      - '**/androidTest/**'
      - '**/commonTest/**'
      - '**/jvmTest/**'
      - '**/androidUnitTest/**'
      - '**/androidInstrumentedTest/**'
      - '**/jsTest/**'
      - '**/iosTest/**'
      - '**/testFoss/**'
      - '**/testGms/**'
      - '**/core/ui/src/main/kotlin/**/theme/**'
      - '**/core/testing/src/main/**'
  ForbiddenImport:
    # Every modal sheet goes through core:ui's PingogramBottomSheet, which keeps it below the status bar
    # (docs/DESIGN_SYSTEM.md §6 "Bottom sheets"); only that wrapper calls Material's.
    active: true
    imports:
      - value: 'androidx.compose.material3.ModalBottomSheet'
        reason: 'Use dev.kyralabs.pingogram.core.ui.component.PingogramBottomSheet: it stops below the status bar.'
    excludes:
      - '**/test/**'
      - '**/core/ui/src/main/kotlin/**/component/BottomSheet.kt'
  UnusedPrivateMember:
    # Private previews are only called by tooling (@Preview or our multi-preview annotation).
    ignoreAnnotated: ['Preview', 'PingogramPreviews']

# Our own rules (build-logic/detekt-rules).
pingogram:
  active: true
  PingogramHardcodedToken:
    # Literal colors, text sizes, sizes, shapes and animation specs in :feature:* production code
    # (CLAUDE.md hard rule 4, docs/DESIGN_SYSTEM.md §1).
    active: true
  PingogramGlobalScope:
    # GlobalScope in production code (CLAUDE.md hard rule 6).
    active: true
  PingogramRunBlocking:
    # runBlocking in production code (.claude/rules/kotlin.md); a call whose caller needs the result before it
    # returns is suppressed with the reason.
    active: true
  PingogramComposedModifier:
    # Modifier.composed {} in production code (docs/PERFORMANCE.md §4).
    active: true
  PingogramSubcomposeAsyncImage:
    # Coil's SubcomposeAsyncImage in production code (docs/PERFORMANCE.md §4, "Images").
    active: true
  PingogramMotionDefault:
    # Animations in :feature:* and :app production code that leave their spec to Compose's defaults, and literal
    # tweens, durations and easings in :app and core:ui (docs/DESIGN_SYSTEM.md §5 and §5.1 Q-26,
    # docs/plans/motion-expressive-plan.md §4). Every check is on.
    active: true
    checks:
      - visibility
      - content
      - crossfade
      - contentSize
      - asState
      - transitions
      - springDefault
      - loops
      - schemeDirect
      - otherAnimators
      - literals
      - items
      - sizeTransform
      - pagerScroll
      - panes
      - coil
      - compositionRead
