# The only place dependency versions live (CLAUDE.md rule 7). Exact, stable versions only.
# Compose artifacts take their versions from the BOM, except where noted.

[versions]
androidGradlePlugin = "9.4.1"
androidxActivity = "1.13.0"
# benchmark-macro-junit4 and the baselineprofile Gradle plugin ship together; keep them on one version
androidxBenchmark = "1.5.0"
androidxCoreSplashscreen = "1.2.0"
# hilt-lifecycle-viewmodel-compose (hiltViewModel); hilt-navigation-compose's copy is deprecated in its favour
androidxHilt = "1.4.0"
androidxLifecycle = "2.11.0"
androidxNavigation = "2.10.2"
androidxProfileinstaller = "1.4.1"
androidxTestExtJunit = "1.3.0"
assertj = "3.27.7"
# Coil 3 image loading, without any coil-network-* artifact: images come only from TDLib's local files
# (core:ui TdlibFileFetcher), so Coil makes no network calls of its own (REQUIREMENTS.md §6.2).
coil = "3.6.3"
composeBom = "2026.09.00"
# detekt-cli runs in its own JVM (pingogram.detekt), so its embedded Kotlin compiler never meets ours.
detekt = "1.23.8"
gradleVersionsPlugin = "0.54.0"
hilt = "2.60.1"
# javax.inject annotations (@Qualifier for core:common's @Dispatcher); the API's only release
javaxInject = "1"
junit = "5.14.4"
junit4 = "4.13.2"
kotlin = "2.4.21"
kotlinxCollectionsImmutable = "0.5.2"
kotlinxCoroutines = "1.11.0"
kotlinxSerialization = "1.11.0"
ksp = "2.3.12"
# ktlint engine used by the ktlint Gradle plugin (pingogram.ktlint)
ktlint = "1.8.0"
ktlintGradlePlugin = "14.2.0"
# Pre-release allowed by CLAUDE.md rule 7: the BOM's material3 1.4.0 keeps the Expressive API
# (MotionScheme.expressive(), MaterialShapes, the *Emphasized type styles, Shapes.largeIncreased
# and friends) internal. 1.5.0-beta01 makes it public and needs only stable Compose 1.12.
# material3-adaptive-navigation-suite uses this version too: it is released in lockstep with material3,
# and the BOM's 1.4.0 suite would mix two material3 lines in one NavigationSuiteScaffold.
material3 = "1.5.0-beta01"
robolectric = "4.17"
roborazzi = "1.76.0"
# tdlib/td commit (TDLib 1.8.68); keep in sync with .github/workflows/tdlib.yml → TDLIB_COMMIT
tdlib = "a94b83d67ab4c8397c6245e541b31a4131ea2f79"
# SHA-256 of tdlib-<first 10 chars of the commit>.aar from SHA256SUMS.txt of that GitHub release (docs/TDLIB.md).
# Not a dependency version: build-logic (pingogram.tdlib) verifies the downloaded AAR against it. "unpinned" (the
# catalog allows no empty value) fails the build with instructions, unless pingogram.tdlib.aar is set.
tdlibAarSha256 = "9984a3569df68d2d18a30b0d138021aa464f0fadcf1f0ec32edd19a5b3bccecd"
turbine = "1.2.1"
# QR code encoder for QR login (feature:auth): pure Java, no Android or network code; R8 keeps only the encoder.
zxing = "3.5.4"

[libraries]
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivity" }
androidx-benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "androidxBenchmark" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-compose-material3-adaptive = { group = "androidx.compose.material3.adaptive", name = "adaptive" }
androidx-compose-material3-adaptive-navigation-suite = { group = "androidx.compose.material3", name = "material3-adaptive-navigation-suite", version.ref = "material3" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "androidxCoreSplashscreen" }
androidx-hilt-lifecycle-viewmodel-compose = { group = "androidx.hilt", name = "hilt-lifecycle-viewmodel-compose", version.ref = "androidxHilt" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-savedstate = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-savedstate", version.ref = "androidxLifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "androidxNavigation" }
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "androidxProfileinstaller" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
# AsyncImage and the singleton ImageLoader; brings coil-core (okio, coroutines). No network artifact (see coil above).
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
# Test-only: HiltTestApplication, @HiltAndroidTest and @BindValue for the Robolectric tests of :app
hilt-android-testing = { group = "com.google.dagger", name = "hilt-android-testing", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
javax-inject = { group = "javax.inject", name = "javax.inject", version.ref = "javaxInject" }
junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
# Runs JUnit 4 tests (Robolectric) on the JUnit Platform; version from junit-bom.
junit-vintage-engine = { group = "org.junit.vintage", name = "junit-vintage-engine" }
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }
kotlinx-collections-immutable = { group = "org.jetbrains.kotlinx", name = "kotlinx-collections-immutable", version.ref = "kotlinxCollectionsImmutable" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
kotlinx-serialization-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-core", version.ref = "kotlinxSerialization" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
roborazzi = { group = "io.github.takahirom.roborazzi", name = "roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { group = "io.github.takahirom.roborazzi", name = "roborazzi-compose", version.ref = "roborazzi" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }

# Static analysis: detekt CLI run by pingogram.detekt, and our own rule set from build-logic/detekt-rules (no version)
detekt-cli = { group = "io.gitlab.arturbosch.detekt", name = "detekt-cli", version.ref = "detekt" }
pingogram-detekt-rules = { group = "dev.kyralabs.pingogram.buildlogic", name = "detekt-rules" }

# Build-logic dependencies (compileOnly in build-logic/convention)
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "androidGradlePlugin" }
compose-gradlePlugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { group = "com.google.devtools.ksp", name = "symbol-processing-gradle-plugin", version.ref = "ksp" }
ktlint-gradlePlugin = { group = "org.jlleitschuh.gradle", name = "ktlint-gradle", version.ref = "ktlintGradlePlugin" }
roborazzi-gradlePlugin = { group = "io.github.takahirom.roborazzi", name = "roborazzi-gradle-plugin", version.ref = "roborazzi" }

# Build-logic dependencies of build-logic/detekt-rules
assertj-core = { group = "org.assertj", name = "assertj-core", version.ref = "assertj" }
detekt-api = { group = "io.gitlab.arturbosch.detekt", name = "detekt-api", version.ref = "detekt" }
detekt-test = { group = "io.gitlab.arturbosch.detekt", name = "detekt-test", version.ref = "detekt" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
android-library = { id = "com.android.library", version.ref = "androidGradlePlugin" }
android-lint = { id = "com.android.lint", version.ref = "androidGradlePlugin" }
android-test = { id = "com.android.test", version.ref = "androidGradlePlugin" }
androidx-baselineprofile = { id = "androidx.baselineprofile", version.ref = "androidxBenchmark" }
gradle-versions = { id = "com.github.ben-manes.versions", version.ref = "gradleVersionsPlugin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradlePlugin" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }

# Convention plugins defined in build-logic (no versions)
pingogram-android-application = { id = "pingogram.android.application" }
pingogram-android-compose = { id = "pingogram.android.compose" }
pingogram-android-feature = { id = "pingogram.android.feature" }
pingogram-android-hilt = { id = "pingogram.android.hilt" }
pingogram-android-library = { id = "pingogram.android.library" }
pingogram-android-lint = { id = "pingogram.android.lint" }
pingogram-android-roborazzi = { id = "pingogram.android.roborazzi" }
pingogram-android-test = { id = "pingogram.android.test" }
pingogram-detekt = { id = "pingogram.detekt" }
pingogram-jvm-library = { id = "pingogram.jvm.library" }
pingogram-ktlint = { id = "pingogram.ktlint" }
pingogram-tdlib = { id = "pingogram.tdlib" }
