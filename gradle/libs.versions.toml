# The only place dependency versions live (CLAUDE.md rule 7). Exact, stable versions only.
# Compose artifacts take their versions from the BOM, except where noted.

[versions]
androidGradlePlugin = "9.4.1"
androidxActivity = "1.13.0"
# benchmark-macro-junit4 and the baselineprofile Gradle plugin ship together; keep them on one version
androidxBenchmark = "1.5.0"
# androidx.core itself, which the app already gets through Compose, Activity and Navigation at this version; declared
# where its classes are used directly (core:ui's FileProvider URIs), so the version is pinned here and nothing changes
androidxCore = "1.18.0"
androidxCoreSplashscreen = "1.2.0"
# Calls with Android's Telecom as a self-managed calling app (feature:calls, docs/adr/0016-calls-and-telecom.md):
# CallsManager, a ConnectionService before Android 14 and the platform's call API from 14, minSdk 24.
androidxCoreTelecom = "1.0.1"
# Preferences DataStore for the app's settings (core:datastore): first-party, no network, approved on 2026-10-18.
androidxDatastore = "1.2.1"
# hilt-lifecycle-viewmodel-compose (hiltViewModel); hilt-navigation-compose's copy is deprecated in its favour. Also
# hilt-work and its KSP processor, androidx.hilt:hilt-compiler, for HiltWorkerFactory (core:notifications)
androidxHilt = "1.4.0"
# Glance for the home screen widget of recent chats (:app, docs/adr/0017-home-screen-widget.md): Compose-style widgets
# rendered into RemoteViews; first-party Jetpack, no network code. glance-material3 maps a Material ColorScheme to the
# widget's colors.
androidxGlance = "1.2.0"
androidxLifecycle = "2.11.0"
androidxNavigation = "2.10.2"
androidxProfileinstaller = "1.4.1"
androidxTestExtJunit = "1.3.0"
# WorkManager: notification actions (reply, mark as read) run as expedited work, so they finish when the app is in the
# background (core:notifications, docs/adr/0001-workmanager-for-notification-actions.md). First-party, no network code;
# work-testing for the worker's tests only.
androidxWork = "2.12.0"
assertj = "3.27.7"
# CameraX for the in-app QR code scanner only (feature:scanner, REQUIREMENTS.md FR-P5; approved by the owner 2026-10-21;
# docs/adr/0012-camerax-and-zxing-qr-scanner.md): camera-core, its Camera2 implementation, the lifecycle binding and
# camera-compose's CameraXViewfinder. First-party Jetpack, no network code and no Google Play services, so foss stays
# Google-free; frames are decoded on the device by ZXing and never leave it. The same artifacts, and camera-video's
# VideoCapture and Recorder, record round video messages in feature:chat (approved by the owner 2026-10-23;
# docs/adr/0032-round-video-messages.md): first-party, no network code; the video goes only into the message sent.
camerax = "1.6.2"
# Coil 3 image loading, without any coil-network-* artifact: images come only from TDLib's local files
# (core:ui TdlibFileFetcher), so Coil makes no network calls of its own (REQUIREMENTS.md §6.2).
coil = "3.6.3"
composeBom = "2026.09.00"
# Lottie renders animated (TGS) stickers into bitmaps off the main thread, behind core:ui's StickerAnimationDecoder
# (docs/adr/0008-lottie-for-animated-stickers.md). Pure Java, no native code; core:ui excludes its AppCompat dependency,
# which only its View (LottieAnimationView) needs.
lottie = "6.7.1"
# FCM push in the gms flavor only (REQUIREMENTS.md FR-N3, approved by the owner; docs/adr/0004-push-delivery.md): the BOM
# pins firebase-messaging and the Firebase and Play services libraries it brings. No other Firebase product.
firebaseBom = "35.0.2"
# detekt-cli runs in its own JVM (pingogram.detekt), so its embedded Kotlin compiler never meets ours.
detekt = "1.23.8"
# The Google Services plugin turns the owner's git-ignored google-services.json into the resources Firebase reads;
# :app applies it only when the file exists (pingogram.android.gms, docs/adr/0004-push-delivery.md).
googleServices = "4.5.0"
gradleVersionsPlugin = "0.54.0"
# Gradle Play Publisher: the optional upload of release.yml's Play bundle (docs/PLAY_STORE.md §7).
gradlePlayPublisher = "4.1.1"
hilt = "2.60.1"
# javax.inject annotations (@Qualifier for core:common's @Dispatcher); the API's only release
javaxInject = "1"
junit = "6.1.3"
junit4 = "4.13.2"
kotlin = "2.4.21"
kotlinxCollectionsImmutable = "0.5.2"
kotlinxCoroutines = "1.11.0"
kotlinxSerialization = "1.11.0"
ksp = "2.3.12"
# ktlint engine used by the ktlint Gradle plugin (pingogram.ktlint)
ktlint = "1.8.0"
ktlintGradlePlugin = "14.2.0"
# Pre-release allowed by CLAUDE.md rule 7: the BOM's material3 1.4.0 keeps the Expressive API
# (MotionScheme.expressive(), MaterialShapes, the *Emphasized type styles, Shapes.largeIncreased
# and friends) internal. 1.5.0-beta01 makes it public and needs only stable Compose 1.12.
# material3-adaptive-navigation-suite uses this version too: it is released in lockstep with material3,
# and the BOM's 1.4.0 suite would mix two material3 lines in one NavigationSuiteScaffold.
material3 = "1.5.0-beta01"
# Voice messages and music in conversations (feature:chat), approved by the owner on 2026-10-18, and videos and GIFs
# in the media viewer (feature:media). media3-exoplayer plays files TDLib has already downloaded, so no
# media3-datasource-* network module; media3-ui-compose draws the videos (PlayerSurface), and never media3-ui
# (View-based; the controls are Compose).
media3 = "1.11.1"
# pytgcalls/ntgcalls commit (NTgCalls 3.0.5), the call engine (docs/adr/0015-call-media-engine.md); keep in sync with
# .github/workflows/ntgcalls.yml → NTGCALLS_COMMIT
ntgcalls = "e8ab467185017827625f664d024824947b5c5d5f-pingogram1"
# SHA-256 of ntgcalls-<first 10 chars of the commit>.aar from SHA256SUMS.txt of that GitHub release, verified by
# build-logic (pingogram.ntgcalls) like tdlibAarSha256; pingogram.ntgcalls.aar replaces it with a self-built AAR.
ntgcallsAarSha256 = "9dd9b2fce089bcff8382930a88c377ba224e4ea09dc107063058b55a45193f2c"
robolectric = "4.17"
roborazzi = "1.76.0"
# tdlib/td commit (TDLib 1.8.68); keep in sync with .github/workflows/tdlib.yml → TDLIB_COMMIT
tdlib = "a94b83d67ab4c8397c6245e541b31a4131ea2f79"
# SHA-256 of tdlib-<first 10 chars of the commit>.aar from SHA256SUMS.txt of that GitHub release (docs/TDLIB.md).
# Not a dependency version: build-logic (pingogram.tdlib) verifies the downloaded AAR against it. "unpinned" (the
# catalog allows no empty value) fails the build with instructions, unless pingogram.tdlib.aar is set.
tdlibAarSha256 = "9984a3569df68d2d18a30b0d138021aa464f0fadcf1f0ec32edd19a5b3bccecd"
turbine = "1.2.1"
# QR codes on the device: the encoder for the codes Pingogram shows (core:ui) and the decoder of the QR code scanner
# (feature:scanner). Pure Java, no Android or network code; R8 keeps only what is used.
zxing = "3.5.4"

[libraries]
