name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  # Run by hand on a tag to publish its release again.
  workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_VERSION: "17"

jobs:
  release:
    name: build-and-publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Derive version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == 0.* || "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # The open-source cache: v6's default ("enhanced") is a closed-source service under Gradle's terms.
          cache-provider: basic

      - name: Write secrets.properties
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          if [[ -z "$TELEGRAM_API_ID" || -z "$TELEGRAM_API_HASH" ]]; then
            echo "::error::TELEGRAM_API_ID / TELEGRAM_API_HASH secrets are not set"; exit 1
          fi
          printf 'TELEGRAM_API_ID=%s\nTELEGRAM_API_HASH=%s\n' "$TELEGRAM_API_ID" "$TELEGRAM_API_HASH" > secrets.properties

      - name: Decode release keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$SIGNING_KEYSTORE_BASE64" ]]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 secret is not set"; exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APKs and AAB (foss)
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        # Two invocations: AGP cannot build the bundle while ABI splits (per-ABI APKs) are on.
        run: |
          ./gradlew :app:assembleFossRelease -Pversion="${{ steps.version.outputs.version }}" --stacktrace --no-daemon
          ./gradlew :app:bundleFossRelease -Pversion="${{ steps.version.outputs.version }}" --stacktrace --no-daemon

      # Every release ships the gms flavor too (docs/RELEASE.md, LICENSE-EXCEPTION.md). Its Firebase configuration is
      # written only after the foss build, so foss never sees it (docs/adr/0004-push-delivery.md).
      - name: Write google-services.json (gms)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [[ -z "$GOOGLE_SERVICES_JSON_BASE64" ]]; then
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 secret is not set (docs/OWNER_SETUP.md §8b)"; exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/src/gms/google-services.json

      - name: Build signed release APKs and AAB (gms)
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleGmsRelease -Pversion="${{ steps.version.outputs.version }}" --stacktrace --no-daemon
          ./gradlew :app:bundleGmsRelease -Pversion="${{ steps.version.outputs.version }}" --stacktrace --no-daemon

      - name: Collect and rename artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          shopt -s nullglob
          for f in app/build/outputs/apk/*/release/*.apk; do
            flavor=$(basename "$(dirname "$(dirname "$f")")")
            abi=$(echo "$f" | grep -oE 'arm64-v8a|armeabi-v7a|x86_64|universal' || echo universal)
            suffix=""; [[ "$flavor" != "foss" ]] && suffix="-$flavor"
            cp "$f" "dist/pingogram-${VERSION}-${abi}${suffix}.apk"
          done
          for f in app/build/outputs/bundle/*/*.aab; do
            flavor=$(basename "$(dirname "$f")")
            cp "$f" "dist/pingogram-${VERSION}-${flavor}.aab"
          done
          ( cd dist && sha256sum *.apk > SHA256SUMS.txt )
          ls -la dist

      # docs/PERFORMANCE.md §1: arm64-v8a at most 50 MB, universal at most 123 MB, in both flavors. A release over
      # budget fails here, before anything is published.
      - name: Check APK sizes
        run: |
          status=0
          echo "| APK | Size | Budget |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for f in dist/*.apk; do
            case "$f" in
              *-arm64-v8a.apk|*-arm64-v8a-*.apk) budget=50 ;;
              *-universal.apk|*-universal-*.apk) budget=123 ;;
              *) budget="" ;;
            esac
            size=$(stat -c %s "$f")
            mb=$(awk -v s="$size" 'BEGIN { printf "%.1f", s / 1048576 }')
            echo "| $(basename "$f") | ${mb} MB | ${budget:+${budget} MB} |" >> "$GITHUB_STEP_SUMMARY"
            if [[ -n "$budget" && "$size" -gt $(( budget * 1048576 )) ]]; then
              echo "::error file=$f::$(basename "$f") is ${mb} MB, over its ${budget} MB budget (docs/PERFORMANCE.md §1)"
              status=1
            fi
          done
          exit $status

      - name: Extract changelog section
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "_No changelog section for ${VERSION}. Update CHANGELOG.md next time._" > release-notes.md
          fi
          {
            echo
            echo "### Downloads"
            echo "- **universal** — works on every device (largest)"
            echo "- **arm64-v8a** — most phones from 2017 onwards"
            echo "- **armeabi-v7a** — older 32-bit devices"
            echo "- **x86_64** — emulators / Chromebooks"
            echo
            echo "The files ending in **-gms** are the same app for phones with Google Play services: they get"
            echo "notifications through Google's push service even when Pingogram is closed. The others contain no"
            echo "Google services; turn on Settings → Notifications → Keep connected to be notified while it is closed."
            echo "Both share their signature, so installing one replaces the other and keeps your data."
            echo
            echo "Verify with \`sha256sum -c SHA256SUMS.txt\`."
            echo
            echo "Pingogram is an unofficial Telegram client. How it follows Telegram's API terms:"
            echo "[docs/API_TERMS.md](https://github.com/${GITHUB_REPOSITORY}/blob/v${VERSION}/docs/API_TERMS.md)."
          } >> release-notes.md
          cat release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Pingogram v${{ steps.version.outputs.version }}
          body_path: release-notes.md
          prerelease: ${{ steps.version.outputs.prerelease }}
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true

      - name: Upload AAB and R8 mapping (artifact only)
        uses: actions/upload-artifact@v7
        with:
          name: pingogram-${{ steps.version.outputs.version }}-bundle-and-mapping
          path: |
            dist/*.aab
            app/build/outputs/mapping/**/mapping.txt
          retention-days: 90

      # The bundle for Google Play: the gms flavor, signed like the rest (docs/PLAY_STORE.md §7). The owner uploads it
      # in Play Console, or the play job below does when it is turned on.
      - name: Upload the Play bundle (gms)
        uses: actions/upload-artifact@v7
        with:
          name: pingogram-${{ steps.version.outputs.version }}-play
          path: dist/pingogram-${{ steps.version.outputs.version }}-gmsRelease.aab
          if-no-files-found: error
          retention-days: 90

  # The release goes to the owner's releases channel too (docs/RELEASE.md, "Channel uploads"): an announcement with the
  # changelog, then each of the 8 APKs, posted by the bot over MTProto (tools/ci/telegram_publish.py), which may upload
  # files of up to 2 GB. A job of its own after the release, from the published release's assets as telegram-post.yml
  # reposts them: the uploads take about 15 minutes, which never hold up the release job or the Play upload. Tags only,
  # and a channel problem never fails the release.
  channel:
    name: releases channel
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download the release's APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern '*.apk' --pattern SHA256SUMS.txt

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Post the release to the channel
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_UPLOAD_API_ID: ${{ secrets.TELEGRAM_UPLOAD_API_ID }}
          TELEGRAM_UPLOAD_API_HASH: ${{ secrets.TELEGRAM_UPLOAD_API_HASH }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          python -m pip install --quiet --require-hashes -r tools/ci/requirements-telegram.txt
          python tools/ci/telegram_publish.py release --version "$VERSION" --dist dist --changelog CHANGELOG.md \
            --repo "$GITHUB_REPOSITORY" --server-url "$GITHUB_SERVER_URL" --channel releases

  # Optional, off by default: uploads the Play bundle to Google Play's internal track with Gradle Play Publisher. It
  # runs only when the repository variable PLAY_PUBLISH is "true", with a service account's JSON key in the secret
  # PLAY_SERVICE_ACCOUNT_JSON (docs/PLAY_STORE.md §7). Promotion to other tracks stays in Play Console.
  play:
    name: upload-to-play
    needs: release
    if: ${{ vars.PLAY_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # Configuring :app needs the API credentials, though nothing is built here.
      - name: Write secrets.properties
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          printf 'TELEGRAM_API_ID=%s\nTELEGRAM_API_HASH=%s\n' "$TELEGRAM_API_ID" "$TELEGRAM_API_HASH" > secrets.properties

      - name: Download the Play bundle
        uses: actions/download-artifact@v8
        with:
          name: pingogram-${{ needs.release.outputs.version }}-play
          path: ${{ runner.temp }}/play-bundle

      - name: Upload to the internal track
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          if [[ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]]; then
            echo "::error::PLAY_PUBLISH is true but the PLAY_SERVICE_ACCOUNT_JSON secret is not set (docs/PLAY_STORE.md §7)"
            exit 1
          fi
          key="$RUNNER_TEMP/play-service-account.json"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$key"
          ./gradlew :app:publishGmsReleaseBundle --artifact-dir "$RUNNER_TEMP/play-bundle" \
            -Pversion="$VERSION" -Ppingogram.play.serviceAccount="$key" --stacktrace --no-daemon
