name: Build TDLib

# Builds TDLib for Android at the pinned commit, packages it as an AAR and publishes it as a
# pre-release tagged tdlib-<short-sha>. The app's `fetchTdlib` Gradle task downloads that asset.
# Run manually (Actions → Build TDLib → Run workflow) after changing TDLIB_COMMIT.
#
# NOTE for maintainers / Claude Code: the official scripts live in tdlib/td at
# example/android/. Their arguments and output paths occasionally change between TDLib
# versions — check example/android/README.md at the pinned commit if a step fails.
# The scripts produce tdlib/tdlib.zip (libs/<abi>/libtdjni.so + java/org/drinkless/tdlib/*.java),
# not an AAR; the "Package AAR" step below turns that into one.

on:
  workflow_dispatch:
    inputs:
      tdlib_commit:
        description: "tdlib/td commit SHA or tag (leave empty to use TDLIB_COMMIT below)"
        required: false
        default: ""

permissions:
  contents: write

env:
  # TDLib 1.8.68. Keep in sync with gradle/libs.versions.toml → tdlib.
  TDLIB_COMMIT: "a94b83d67ab4c8397c6245e541b31a4131ea2f79"
  ANDROID_API: "26"
  ABIS: "arm64-v8a armeabi-v7a x86_64"
  # NDK r28+ aligns 64-bit .so files to 16 KB pages (required on Android 15+); 32-bit ABIs keep
  # 4 KB pages, the only page size their devices use.
  ANDROID_NDK_VERSION: "28.1.13356709"
  # androidx.annotation is on the compile classpath because TDLib adds @IntDef to TdApi.java.
  ANNOTATION_VERSION: "1.4.0"

jobs:
  build:
    name: build-aar
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Resolve commit
        id: commit
        run: |
          C="${{ inputs.tdlib_commit }}"
          [[ -z "$C" ]] && C="${TDLIB_COMMIT}"
          echo "commit=$C" >> "$GITHUB_OUTPUT"

      - name: Checkout tdlib/td
        uses: actions/checkout@v4
        with:
          repository: tdlib/td
          ref: ${{ steps.commit.outputs.commit }}
          path: td
          fetch-depth: 1

      - name: Record resolved SHA
        id: sha
        working-directory: td
        run: |
          FULL=$(git rev-parse HEAD)
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          echo "short=${FULL:0:10}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make git zlib1g-dev libssl-dev gperf php-cli perl cmake \
            clang libc++-dev libc++abi-dev ninja-build unzip zip wget

      - name: Check environment
        working-directory: td/example/android
        run: ./check-environment.sh

      - name: Fetch Android SDK/NDK (TDLib's helper)
        working-directory: td/example/android
        run: ./fetch-sdk.sh SDK "$ANDROID_NDK_VERSION"

      - name: Build OpenSSL for Android
        working-directory: td/example/android
        run: ./build-openssl.sh SDK "$ANDROID_NDK_VERSION" third-party/openssl

      - name: Build TDLib (JNI + Java bindings)
        working-directory: td/example/android
        run: |
          ./build-tdlib.sh SDK "$ANDROID_NDK_VERSION" third-party/openssl c++_static Java \
            "$ANDROID_API" "$ABIS"

      - name: Package AAR
        id: collect
        env:
          SHORT: ${{ steps.sha.outputs.short }}
        run: |
          set -euo pipefail
          OUT=td/example/android/tdlib
          WORK=$RUNNER_TEMP/aar
          mkdir -p "$WORK/classes" "$WORK/aar/jni" dist

          wget -q -O "$RUNNER_TEMP/annotation.jar" \
            "https://maven.google.com/androidx/annotation/annotation/${ANNOTATION_VERSION}/annotation-${ANNOTATION_VERSION}.jar"
          javac --release 11 -nowarn -encoding UTF-8 \
            -cp "td/example/android/SDK/platforms/android-34/android.jar:$RUNNER_TEMP/annotation.jar" \
            -d "$WORK/classes" $(find "$OUT/java" -name '*.java')
          jar cf "$WORK/aar/classes.jar" -C "$WORK/classes" .

          for ABI in $ABIS; do
            mkdir -p "$WORK/aar/jni/$ABI"
            cp "$OUT/libs/$ABI/"*.so "$WORK/aar/jni/$ABI/"
          done

          cat > "$WORK/aar/AndroidManifest.xml" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="org.drinkless.tdlib">
              <uses-sdk android:minSdkVersion="${ANDROID_API}" />
          </manifest>
          EOF
          # JNI creates TdApi objects and calls Client callbacks by name, so R8 must keep them.
          printf -- '-keep class org.drinkless.tdlib.** { *; }\n' > "$WORK/aar/proguard.txt"
          : > "$WORK/aar/R.txt"

          ( cd "$WORK/aar" && zip -qr "$GITHUB_WORKSPACE/dist/tdlib-${SHORT}.aar" . )
          ( cd "$OUT/java" && zip -qr "$GITHUB_WORKSPACE/dist/tdlib-${SHORT}-sources.jar" . )
          ( cd dist && sha256sum *.aar *.jar > SHA256SUMS.txt )
          echo "aar=dist/tdlib-${SHORT}.aar" >> "$GITHUB_OUTPUT"
          unzip -l "dist/tdlib-${SHORT}.aar"
          ls -la dist

      - name: Verify 16 KB page alignment (64-bit ABIs)
        run: |
          set -euo pipefail
          mkdir -p check && ( cd check && unzip -oq "../${{ steps.collect.outputs.aar }}" )
          READELF=$(find td/example/android/SDK/ndk -path '*linux-x86_64/bin/llvm-readelf' | head -n 1)
          FAIL=0
          for so in $(find check -name '*.so'); do
            ALIGN=$("$READELF" -lW "$so" | awk '/LOAD/ {print $NF}' | sort -u | tr '\n' ' ')
            echo "$so → LOAD align: $ALIGN"
            case "$so" in
              */arm64-v8a/*|*/x86_64/*)
                if [[ "$ALIGN" != *0x4000* ]]; then echo "::error::$so is not 16 KB aligned"; FAIL=1; fi ;;
            esac
          done
          exit $FAIL

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: tdlib-${{ steps.sha.outputs.short }}
          path: dist/*
          retention-days: 90

      - name: Publish as tdlib-* pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tdlib-${{ steps.sha.outputs.short }}
          name: TDLib ${{ steps.sha.outputs.short }} (Android AAR)
          prerelease: true
          body: |
            Prebuilt TDLib for Android.
            - tdlib/td commit: `${{ steps.sha.outputs.full }}`
            - ABIs: ${{ env.ABIS }} · min API ${{ env.ANDROID_API }}
            - Built with NDK ${{ env.ANDROID_NDK_VERSION }} (64-bit libraries 16 KB page aligned)
            - License: Boost Software License 1.0 (https://github.com/tdlib/td)

            Consumed by `core/tdlib` via the `fetchTdlib` Gradle task.
          files: |
            dist/*.aar
            dist/*.jar
            dist/SHA256SUMS.txt
