name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "17"

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The color themes (tools/theme, docs/adr/0016-color-themes.md) are generated into Kotlin and resources and
      # committed: generating them again must change nothing, or someone edited the output by hand.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check the generated color themes
        working-directory: tools/theme
        run: |
          npm ci
          npm run generate
          git diff --exit-code -- ../../core/ui/src/main ../../app/src/main

      # The channel uploader's tests (tools/ci/telegram_publish.py): the standard library only, no secrets.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Test the channel uploader
        run: python -m unittest discover -s tools/ci -p 'test_*.py' -v

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # The open-source cache: v6's default ("enhanced") is a closed-source service under Gradle's terms.
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Secrets are unavailable to PRs from forks; placeholders let the build compile.
      # The resulting debug APK cannot log in, which is fine for CI.
      - name: Write secrets.properties
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          printf 'TELEGRAM_API_ID=%s\nTELEGRAM_API_HASH=%s\n' \
            "${TELEGRAM_API_ID:-0}" "${TELEGRAM_API_HASH:-00000000000000000000000000000000}" \
            > secrets.properties

      - name: Static checks and unit tests
        run: ./gradlew check --stacktrace --no-daemon

      - name: Assemble debug APK
        run: ./gradlew :app:assembleFossDebug --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: pingogram-foss-debug
          path: app/build/outputs/apk/foss/debug/*.apk
          retention-days: 14

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          retention-days: 7

  # The debug APKs of every push to main go to the owner's debug channel (docs/RELEASE.md, "Channel uploads"): every
  # ABI, from the build's artifact, posted by the bot over MTProto (tools/ci/telegram_publish.py), never to the releases
  # channel. A job of its own, so uploading never holds up or times out the build. Pull requests never post, and a
  # channel problem never fails CI.
  debug-channel:
    name: debug channel
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # About 2 minutes per 100 MB uploaded (0.85 MB/s from GitHub's runners, 2026-10-29).
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download the debug APKs
        uses: actions/download-artifact@v8
        with:
          name: pingogram-foss-debug
          path: ${{ runner.temp }}/debug-apks

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Post the debug APKs to the debug channel
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_DEBUG_CHANNEL_ID: ${{ secrets.TELEGRAM_DEBUG_CHANNEL_ID }}
          # Not posted to: only compared, so nothing is posted when the debug secret names the releases channel.
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_UPLOAD_API_ID: ${{ secrets.TELEGRAM_UPLOAD_API_ID }}
          TELEGRAM_UPLOAD_API_HASH: ${{ secrets.TELEGRAM_UPLOAD_API_HASH }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python -m pip install --quiet --require-hashes -r tools/ci/requirements-telegram.txt
          python tools/ci/telegram_publish.py debug --sha "$GITHUB_SHA" --subject "$(git log -1 --format=%s)" \
            --run-url "$RUN_URL" --apk-dir "$RUNNER_TEMP/debug-apks"

  # The APK size budget (docs/PERFORMANCE.md §1, §8): the foss APKs built as a release is (R8, resource shrinking),
  # signed with the debug key so no release credentials are needed; arm64-v8a at most 50 MB, universal 123 MB. Its own
  # job, beside build, so the build's tests do not wait for R8.
  apk-size:
    name: apk size
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Placeholders: the size does not depend on the values, and secrets are unavailable to forks.
      - name: Write secrets.properties
        run: |
          printf 'TELEGRAM_API_ID=%s\nTELEGRAM_API_HASH=%s\n' 0 00000000000000000000000000000000 > secrets.properties

      - name: Check the APK size budget
        run: ./gradlew :app:checkFossBenchmarkReleaseApkSize --stacktrace --no-daemon

      - name: Upload the size report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apk-size
          path: app/build/reports/apk-size/
          retention-days: 14
