name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "17"

jobs:
  # The quick checks, and the groups of modules the `check` jobs below run in parallel (tools/ci/check-shards.json,
  # checked by tools/ci/check_shards.py against settings.gradle.kts, so a new module in no group fails here).
  quick-checks:
    name: quick checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The color themes (tools/theme, docs/adr/0016-color-themes.md) are generated into Kotlin and resources and
      # committed: generating them again must change nothing, or someone edited the output by hand.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check the generated color themes
        working-directory: tools/theme
        run: |
          npm ci
          npm run generate
          git diff --exit-code -- ../../core/ui/src/main ../../app/src/main

      # The CI tools' tests (tools/ci: the channel uploader, the check groups): the standard library only, no secrets.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Test the CI tools
        run: python -m unittest discover -s tools/ci -p 'test_*.py' -v

      - name: Plan the check groups
        id: shards
        run: python tools/ci/check_shards.py --github-output "$GITHUB_OUTPUT"

  # `./gradlew check`, split into groups of modules that run side by side: one job took 39 to 59 minutes (2026-11-15),
  # nearly all of it in `check`. Each group restores the Gradle cache main wrote, so modules it only depends on come
  # from the build cache rather than being compiled again.
  check:
    name: check (${{ matrix.shard.name }})
    needs: quick-checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.quick-checks.outputs.shards) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # The open-source cache: v6's default ("enhanced") is a closed-source service under Gradle's terms.
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Secrets are unavailable to PRs from forks; placeholders let the build compile.
      - name: Write secrets.properties
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          printf 'TELEGRAM_API_ID=%s\nTELEGRAM_API_HASH=%s\n' \
            "${TELEGRAM_API_ID:-0}" "${TELEGRAM_API_HASH:-00000000000000000000000000000000}" \
            > secrets.properties

      - name: Static checks and unit tests
        run: ./gradlew -I tools/ci/maven-central-mirror.gradle ${{ matrix.shard.tasks }} --stacktrace --no-daemon

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.shard.name }}
          path: |
            **/build/reports/**
            **/build/test-results/**
          retention-days: 7

  # The debug APK, beside the checks. The resulting APK of a fork's PR cannot log in, which is fine for CI.
  debug-apk:
    name: debug apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Write secrets.properties
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          printf 'TELEGRAM_API_ID=%s\nTELEGRAM_API_HASH=%s\n' \
            "${TELEGRAM_API_ID:-0}" "${TELEGRAM_API_HASH:-00000000000000000000000000000000}" \
            > secrets.properties

      - name: Assemble debug APK
        run: ./gradlew -I tools/ci/maven-central-mirror.gradle :app:assembleFossDebug --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: pingogram-foss-debug
          path: app/build/outputs/apk/foss/debug/*.apk
          retention-days: 14

  # One result for all of the above and the APK size budget, under the name pull requests and the debug channel have
  # always waited for: "build" passes only when every check did, so a merge that waits for it waits for all of them.
  build:
    name: build
    needs: [quick-checks, check, debug-apk, apk-size]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every check passed
        env:
          RESULTS: >-
            ${{ needs.quick-checks.result }} ${{ needs.check.result }} ${{ needs.debug-apk.result }}
            ${{ needs.apk-size.result }}
        run: |
          echo "quick checks, check, debug apk, apk size: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || { echo "Not every check passed."; exit 1; }
          done

  # The debug APKs of every push to main go to the owner's debug channel (docs/RELEASE.md, "Channel uploads"): every
  # ABI, from the build's artifact, posted by the bot over MTProto (tools/ci/telegram_publish.py), never to the releases
  # channel. A job of its own, so uploading never holds up or times out the build. Pull requests never post, and a
  # channel problem never fails CI.
  debug-channel:
    name: debug channel
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # About 2 minutes per 100 MB uploaded (0.85 MB/s from GitHub's runners, 2026-10-29).
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download the debug APKs
        uses: actions/download-artifact@v8
        with:
          name: pingogram-foss-debug
          path: ${{ runner.temp }}/debug-apks

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Post the debug APKs to the debug channel
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_DEBUG_CHANNEL_ID: ${{ secrets.TELEGRAM_DEBUG_CHANNEL_ID }}
          # Not posted to: only compared, so nothing is posted when the debug secret names the releases channel.
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_UPLOAD_API_ID: ${{ secrets.TELEGRAM_UPLOAD_API_ID }}
          TELEGRAM_UPLOAD_API_HASH: ${{ secrets.TELEGRAM_UPLOAD_API_HASH }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python -m pip install --quiet --require-hashes -r tools/ci/requirements-telegram.txt
          python tools/ci/telegram_publish.py debug --sha "$GITHUB_SHA" --subject "$(git log -1 --format=%s)" \
            --run-url "$RUN_URL" --apk-dir "$RUNNER_TEMP/debug-apks"

  # The APK size budget (docs/PERFORMANCE.md §1, §8): the foss APKs built as a release is (R8, resource shrinking),
  # signed with the debug key so no release credentials are needed; arm64-v8a at most 53 MB, universal 128 MB. Its own
  # job, so the tests do not wait for R8; the build gate waits for it.
  apk-size:
    name: apk size
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Placeholders: the size does not depend on the values, and secrets are unavailable to forks.
      - name: Write secrets.properties
        run: |
          printf 'TELEGRAM_API_ID=%s\nTELEGRAM_API_HASH=%s\n' 0 00000000000000000000000000000000 > secrets.properties

      - name: Check the APK size budget
        run: ./gradlew -I tools/ci/maven-central-mirror.gradle :app:checkFossBenchmarkReleaseApkSize --stacktrace --no-daemon

      - name: Upload the size report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apk-size
          path: app/build/reports/apk-size/
          retention-days: 14
