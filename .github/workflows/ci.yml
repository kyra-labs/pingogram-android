name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "17"

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # The open-source cache: v6's default ("enhanced") is a closed-source service under Gradle's terms.
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Secrets are unavailable to PRs from forks; placeholders let the build compile.
      # The resulting debug APK cannot log in, which is fine for CI.
      - name: Write secrets.properties
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          printf 'TELEGRAM_API_ID=%s\nTELEGRAM_API_HASH=%s\n' \
            "${TELEGRAM_API_ID:-0}" "${TELEGRAM_API_HASH:-00000000000000000000000000000000}" \
            > secrets.properties

      - name: Static checks and unit tests
        run: ./gradlew check --stacktrace --no-daemon

      - name: Assemble debug APK
        run: ./gradlew :app:assembleFossDebug --stacktrace --no-daemon

      # The debug APK of every push to main goes to the owner's channel (docs/RELEASE.md, "Channel uploads"); pull
      # requests never post, and a channel problem never fails the build. Only arm64-v8a: a bot may send at most 50 MB,
      # and the run's artifact has every ABI.
      - name: Post debug APK to the channel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          caption="Pingogram debug ${GITHUB_SHA::7}"$'\n'"$(git log -1 --format=%s)"$'\n\n'
          caption+="Debug build for arm64-v8a phones; it installs next to the release app. Every ABI: ${RUN_URL}"
          tools/ci/telegram-publish.sh "$caption" app/build/outputs/apk/foss/debug/*-arm64-v8a-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: pingogram-foss-debug
          path: app/build/outputs/apk/foss/debug/*.apk
          retention-days: 14

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          retention-days: 7
