# DRAFT for review (docs/RELEASE.md, "F-Droid and IzzyOnDroid"): the recipe F-Droid's main repository would need, in
# fdroiddata's format (https://f-droid.org/docs/Build_Metadata_Reference/). Not submitted. It does not build as it
# stands: the open points are marked TODO and listed in docs/RELEASE.md.
Categories:
  - Internet
  - Messaging
License: GPL-3.0-or-later
AuthorName: Kyra Labs
SourceCode: https://github.com/kyra-labs/pingogram-android
IssueTracker: https://github.com/kyra-labs/pingogram-android/issues
Changelog: https://github.com/kyra-labs/pingogram-android/blob/HEAD/CHANGELOG.md
Translation: https://hosted.weblate.org/engage/pingogram/

AutoName: Pingogram
# Descriptions, graphics and screenshots come from fastlane/metadata/android/en-US/ in the repository.

RepoType: git
Repo: https://github.com/kyra-labs/pingogram-android.git

Builds:
  # One build per ABI, as the GitHub releases: version codes MAJOR*1_000_000 + MINOR*10_000 + PATCH*100 + ABI index
  # (docs/RELEASE.md). Shown for arm64-v8a; armeabi-v7a (…01) and x86_64 (…03) differ only in versionCode and the
  # abi property.
  - versionName: 1.0.0
    versionCode: 1000002
    commit: v1.0.0
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y gperf php-cli
    gradle:
      - foss
    srclibs:
      - tdlib@a94b83d67ab4c8397c6245e541b31a4131ea2f79
    output: build/outputs/apk/foss/release/app-foss-arm64-v8a-release-unsigned.apk
    prebuild:
      # The Telegram API values (docs/TDLIB.md): a public recipe has to carry them in clear text.
      # TODO(owner): whether Pingogram's api_id may appear in fdroiddata (Telegram's terms: one api_id per app).
      - printf 'TELEGRAM_API_ID=%s\nTELEGRAM_API_HASH=%s\n' TODO TODO > ../secrets.properties
    build:
      # TDLib from its sources at the pinned commit (the steps of .github/workflows/tdlib.yml), as F-Droid accepts no
      # prebuilt AAR. TODO: package the AAR as that workflow's "Package AAR" step does (a script in tools/ would let
      # both share it).
      - pushd $$tdlib$$/example/android
      - ./build-openssl.sh $$SDK$$ $$NDK$$ third-party/openssl
      - ./build-tdlib.sh $$SDK$$ $$NDK$$ third-party/openssl c++_static Java 26 arm64-v8a
      - popd
      # TODO: the call engine from source (docs/adr/0030-calls-in-the-fdroid-build.md): NTgCalls' build downloads
      #   prebuilt WebRTC, which F-Droid does not accept. Calls stay, as in Telegram FOSS and Telegram X: WebRTC as a
      #   source tree built with the NDK. The spike (2026-10-27) built Telegram X's tree as its recipe does: a 6.2 GB
      #   checkout with submodules, 35 min and 2.8 GB of build per ABI on 4 cores, so this recipe will want
      #   `submodules: true`, `timeout: 18000` as Telegram X's, and cmake, gperf, automake and libtool installed.
      #   Next: NTgCalls compiled against that tree (6 WebRTC headers it includes are missing there).
    gradleprops:
      # The self-built TDLib instead of the release asset (docs/TDLIB.md), release APKs without the owner's key
      # (F-Droid signs them), and the version the tag names.
      - pingogram.tdlib.aar=$$tdlib$$/example/android/tdlib.aar
      - pingogram.unsignedRelease=true
      - version=0.5.0
    ndk: r28b

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
CurrentVersion: 1.0.0
CurrentVersionCode: 1000002
